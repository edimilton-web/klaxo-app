<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klaxo Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;600&family=Nunito:wght@900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0614;
    --violet: #7C3AED;
    --lilac: #A78BFA;
    --deep: #3B0764;
    --mint: #34D399;
    --amber: #FBBF24;
    --ink: #F5F3FF;
    --muted: #A1A1C2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #050309; color: var(--ink); font-family: "DM Sans", sans-serif; overflow: hidden; }

  /* Palco 1080×1920 (Reels) escalado para caber na janela */
  #viewport { position: absolute; inset: 0 0 64px 0; overflow: hidden; }
  body.render #viewport { inset: 0; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: var(--bg); transform-origin: 0 0; left: 50%; top: 50%;
  }
  .layer { position: absolute; inset: 0; }
  .abs { position: absolute; }
  .center-x { left: 0; right: 0; text-align: center; }
  .mono { font-family: "JetBrains Mono", monospace; }

  /* Fundo */
  .glow { position: absolute; border-radius: 50%; filter: blur(120px); }
  #grid {
    position: absolute; inset: -200px;
    background-image:
      linear-gradient(rgba(167,139,250,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(167,139,250,.07) 1px, transparent 1px);
    background-size: 90px 90px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
  }

  /* Cena 1 — terminal */
  .term-line { left: 90px; font-size: 38px; color: var(--lilac); white-space: pre; }
  .term-line .ok { color: var(--mint); }
  .caret { display: inline-block; width: 20px; height: 40px; background: var(--lilac); vertical-align: -6px; margin-left: 4px; }
  .headline { font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; }

  /* Cena 2 — carrossel */
  #carousel { position: absolute; left: 0; right: 0; top: 840px; height: 380px; perspective: 1400px; }
  .card {
    position: absolute; left: 50%; top: 0; width: 560px; height: 340px; margin-left: -280px;
    border-radius: 40px; padding: 36px;
    background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
    border: 1.5px solid rgba(255,255,255,.16);
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    backdrop-filter: blur(6px);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .card .top { display: flex; align-items: center; gap: 22px; }
  .badge {
    width: 100px; height: 100px; border-radius: 28px; display: grid; place-items: center;
    font-weight: 800; font-size: 44px; color: #fff;
  }
  .card .name { font-size: 44px; font-weight: 700; }
  .card .renew { font-size: 28px; color: var(--muted); margin-top: 4px; }
  .card .price { font-size: 80px; font-weight: 800; letter-spacing: -0.03em; }
  .card .price small { font-size: 26px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .card.unused::after {
    content: var(--flagText); position: absolute; right: 36px; top: -24px; background: #1a1206;
    font: 600 24px "JetBrains Mono", monospace; color: var(--amber);
    border: 1.5px solid var(--amber); border-radius: 10px; padding: 6px 10px; opacity: var(--flag, 0);
  }

  /* Cena 3 — ondas */
  .ring { position: absolute; left: 50%; top: 860px; border-radius: 50%; border: 3px solid var(--lilac); }
  .callout {
    left: 70px; right: 70px; height: 104px; padding: 0 30px; border-radius: 22px;
    display: flex; align-items: center; font-size: 31px; white-space: pre;
    background: rgba(124,58,237,.12); border: 1.5px solid rgba(167,139,250,.35);
  }
  .callout .tag { font-weight: 600; margin-right: 18px; }

  /* Controlos (não aparecem no render) */
  #controls {
    position: fixed; left: 0; right: 0; bottom: 0; height: 64px; display: flex; gap: 14px; align-items: center;
    padding: 0 18px; background: #120b20; border-top: 1px solid #2a1f42; font: 14px "JetBrains Mono", monospace; color: #cfc6ee;
  }
  #controls button { background: var(--violet); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  #controls input[type=range] { flex: 1; accent-color: var(--violet); }
  body.render #controls { display: none; }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <!-- Fundo -->
    <div class="layer" id="bg">
      <div id="grid"></div>
      <div class="glow" id="g1" style="width:900px;height:900px;background:#7C3AED;opacity:.45"></div>
      <div class="glow" id="g2" style="width:700px;height:700px;background:#3B0764;opacity:.7"></div>
      <div class="glow" id="g3" style="width:600px;height:600px;background:#A78BFA;opacity:.18"></div>
    </div>

    <!-- Marca fixa no topo (cenas 2–4) -->
    <div class="abs" id="brandTag" style="left:0;right:0;top:120px;display:flex;justify-content:center;align-items:center;gap:18px;font:600 30px 'JetBrains Mono',monospace;color:#DDD6FE">
      <span style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#A78BFA,#7C3AED 52%,#3B0764);display:grid;place-items:center;font:900 34px Nunito,sans-serif;color:#fff">K</span>
      <span data-i18n="brand"></span>
    </div>

    <!-- Cena 1: terminal + pergunta -->
    <div class="layer" id="s1">
      <div class="abs term-line mono" id="t1" style="top:560px"></div>
      <div class="abs term-line mono" id="t2" style="top:620px"></div>
      <div class="abs term-line mono" id="t3" style="top:680px"></div>
      <div class="abs headline" id="h1" style="left:90px;right:60px;top:800px;font-size:124px"></div>
    </div>

    <!-- Cena 2: carrossel de subscrições -->
    <div class="layer" id="s2">
      <div class="abs center-x mono" id="totLabel" style="top:430px;font-size:30px;letter-spacing:.2em;color:var(--lilac)" data-i18n="totLabel"></div>
      <div class="abs center-x headline" id="totNum" style="top:480px;font-size:170px"></div>
      <div id="carousel"></div>
      <div class="abs center-x mono" id="s2foot" style="top:1330px;font-size:30px;color:var(--muted)"></div>
    </div>

    <!-- Cena 3: ondas + callouts -->
    <div class="layer" id="s3">
      <div id="rings"></div>
      <div class="abs center-x headline" id="bigNum" style="top:760px;font-size:200px"></div>
      <div class="abs center-x mono" id="bigLabel" style="top:990px;font-size:32px;letter-spacing:.2em;color:var(--lilac)" data-i18n="bigLabel"></div>
      <div class="abs callout mono" id="c1" style="top:1180px"></div>
      <div class="abs callout mono" id="c2" style="top:1310px"></div>
      <div class="abs callout mono" id="c3" style="top:1440px"></div>
    </div>

    <!-- Cena 4: poupança -->
    <div class="layer" id="s4">
      <div class="abs center-x mono" id="p0" style="top:640px;font-size:32px;letter-spacing:.2em;color:var(--mint)" data-i18n="p0"></div>
      <div class="abs center-x headline" id="p1" style="top:700px;font-size:230px;color:var(--mint)"></div>
      <div class="abs center-x headline" id="p2" style="top:960px;font-size:84px" data-i18n="p2"></div>
      <div class="abs center-x mono" id="p3" style="top:1230px;font-size:40px;color:var(--lilac)"></div>
    </div>

    <!-- Cena 5: logo -->
    <div class="layer" id="s5">
      <div class="abs" id="logoWrap" style="left:390px;top:560px;width:300px;height:300px">
        <svg width="300" height="300" viewBox="0 0 100 100" fill="none" style="overflow:visible" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="kg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#A78BFA"/><stop offset="52%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#3B0764"/>
            </linearGradient>
            <linearGradient id="ksh" x1="50" y1="4" x2="50" y2="60" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="white" stop-opacity="0.2"/><stop offset="100%" stop-color="white" stop-opacity="0"/>
            </linearGradient>
            <filter id="kgl" x="-45%" y="-45%" width="190%" height="190%">
              <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#6D28D9" flood-opacity="0.65"/>
              <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#A78BFA" flood-opacity="0.35"/>
            </filter>
          </defs>
          <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#kg)" filter="url(#kgl)"/>
          <rect x="4" y="4" width="92" height="52" rx="22" fill="url(#ksh)"/>
          <text x="50" y="70" text-anchor="middle" fill="white" font-size="62" font-family="Nunito, 'Arial Rounded MT Bold', sans-serif" font-weight="900">K</text>
        </svg>
      </div>
      <div class="abs center-x headline" id="word" style="top:920px;font-size:150px">Klaxo</div>
      <div class="abs center-x" id="tag" style="top:1110px;font-size:52px;font-weight:500;line-height:1.25;color:#DDD6FE" data-i18n="tag"></div>
      <div class="abs" id="pill" style="left:50%;top:1330px;transform:translateX(-50%);padding:22px 48px;border-radius:999px;background:var(--violet);font:600 44px 'JetBrains Mono',monospace;box-shadow:0 20px 60px rgba(124,58,237,.6)">klaxo.app</div>
    </div>
  </div>
</div>

<div id="controls">
  <button id="play">⏸</button>
  <button id="restart">↺</button>
  <input type="range" id="scrub" min="0" max="15500" step="10" value="0">
  <span id="time">0.00s</span>
  <button id="sound">🔇 som</button>
  <button id="lang"></button>
</div>

<script>
/* Animação 100% determinística: tudo é função de t (segundos).
   O export de vídeo chama window.renderFrame(t) frame a frame. */
const DURATION = 15.5;
window.DURATION = DURATION;

const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeBack = p => { const c = 1.7, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const eur = v => v.toFixed(2).replace('.', ',') + ' €';
const type = (s, p) => s.slice(0, Math.round(s.length * clamp(p)));
// opacidade de uma cena com fade-in/fade-out
const sceneAlpha = (t, a, b, f = .35) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));

/* Idioma: ?lang=es | ?lang=pt (padrão pt); o botão ES/PT troca sem recarregar */
const COPY_ALL = {
  pt: {
    brand: 'gestor de subscrições',
    t1: '> a procurar subscrições...', t2: '> encontradas: ', t3: '> total por mês: ???',
    h1: 'Sabes quanto<br>gastas em<br><span style="color:var(--lilac)">subscrições?</span>',
    totLabel: 'AS TUAS SUBSCRIÇÕES · TOTAL / MÊS', perMonth: ' / mês', flag: '"SEM USO · 60d"',
    foot: '3 subscrições sem uso detetadas',
    bigLabel: 'GASTO EM SUBSCRIÇÕES / MÊS',
    c1: '3 subscrições sem uso há 60+ dias', c2: 'Avisamos antes de cada renovação', c3: s => `Cancela e poupa ${s}/mês`,
    p0: 'COM O KLAXO', p2: 'por mês.<br><span style="color:var(--muted)">Todos os meses.</span>', p3: s => `= ${s} por ano`,
    tag: 'Gere todas as tuas subscrições.<br>Num só lugar.',
    gym: 'Ginásio', renewSoon: 'renova em 2 dias', renew: d => `renova a ${d}`, months: ['out', 'nov'],
  },
  es: {
    brand: 'gestor de suscripciones',
    t1: '> buscando suscripciones...', t2: '> encontradas: ', t3: '> total al mes: ???',
    h1: '¿Sabes cuánto<br>gastas en<br><span style="color:var(--lilac)">suscripciones?</span>',
    totLabel: 'TUS SUSCRIPCIONES · TOTAL / MES', perMonth: ' / mes', flag: '"SIN USO · 60d"',
    foot: '3 suscripciones sin uso detectadas',
    bigLabel: 'GASTO EN SUSCRIPCIONES / MES',
    c1: '3 suscripciones sin usar en 60 días', c2: 'Te avisamos antes de cada renovación', c3: s => `Cancela y ahorra ${s}/mes`,
    p0: 'CON KLAXO', p2: 'al mes.<br><span style="color:var(--muted)">Todos los meses.</span>', p3: s => `= ${s} al año`,
    tag: 'Gestiona todas tus suscripciones.<br>En un solo lugar.',
    gym: 'Gimnasio', renewSoon: 'se renueva en 2 días', renew: d => `se renueva el ${d}`, months: ['oct', 'nov'],
  },
};

const SUBS = [
  { n: 'Netflix',         c: '#E50914', i: 'N',  p: 13.99, d: 0 },
  { n: 'Spotify',         c: '#1DB954', i: 'S',  p: 10.99, d: [14, 0] },
  { n: 'Disney+',         c: '#113CCF', i: 'D+', p: 9.99,  d: [18, 0], u: 1 },
  { n: 'ChatGPT Plus',    c: '#10A37F', i: 'AI', p: 22.99, d: [21, 0] },
  { n: 'YouTube Premium', c: '#FF0033', i: '▶',  p: 12.99, d: [23, 0] },
  { n: 'iCloud+',         c: '#3693F3', i: '☁',  p: 2.99,  d: [25, 0] },
  { n: 'gym',             c: '#F59E0B', i: 'G',  p: 34.90, d: [1, 1] },
  { n: 'Adobe CC',        c: '#DA1F26', i: 'A',  p: 24.59, d: [3, 1], u: 1 },
  { n: 'Audible',         c: '#F8991C', i: 'Au', p: 9.99,  d: [7, 1], u: 1 },
];
const TOTAL = SUBS.reduce((s, x) => s + x.p, 0);            // 143,42
const SAVE = SUBS.filter(x => x.u).reduce((s, x) => s + x.p, 0); // 44,57

// cria os cartões (conteúdo preenchido em setLang)
const carousel = $('carousel');
const cards = SUBS.map(s => {
  const el = document.createElement('div');
  el.className = 'card' + (s.u ? ' unused' : '');
  carousel.appendChild(el);
  return el;
});

let LANG, COPY;
function setLang(l) {
  LANG = l; COPY = COPY_ALL[l];
  document.documentElement.lang = l === 'es' ? 'es-ES' : 'pt-PT';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = COPY[el.dataset.i18n]; });
  $('h1').innerHTML = COPY.h1;
  document.documentElement.style.setProperty('--flagText', COPY.flag);
  SUBS.forEach((s, i) => {
    const name = s.n === 'gym' ? COPY.gym : s.n;
    const renew = s.d === 0 ? COPY.renewSoon : COPY.renew(s.d[0] + ' ' + COPY.months[s.d[1]]);
    cards[i].innerHTML = `<div class="top"><div class="badge" style="background:${s.c}">${s.i}</div>
    <div><div class="name">${name}</div><div class="renew">${renew}</div></div></div>
    <div class="price">${eur(s.p)}<small>${COPY.perMonth}</small></div>`;
  });
  const btn = $('lang'); if (btn) btn.textContent = l === 'es' ? 'PT' : 'ES';
}
setLang(new URLSearchParams(location.search).get('lang') === 'es' ? 'es' : 'pt');
window.setLang = setLang;

// anéis da onda
const rings = [...Array(5)].map(() => {
  const r = document.createElement('div'); r.className = 'ring'; $('rings').appendChild(r); return r;
});

function show(el, alpha, extra = '') {
  el.style.opacity = alpha;
  el.style.visibility = alpha <= 0.001 ? 'hidden' : 'visible';
  if (extra !== null) el.style.transform = extra;
}

function renderFrame(t) {
  /* ---------- Fundo ---------- */
  $('g1').style.transform = `translate(${-200 + Math.sin(t * .4) * 120}px, ${200 + Math.cos(t * .3) * 160}px)`;
  $('g2').style.transform = `translate(${500 + Math.cos(t * .35) * 140}px, ${1200 + Math.sin(t * .25) * 120}px)`;
  $('g3').style.transform = `translate(${300 + Math.sin(t * .5) * 200}px, ${700 + Math.cos(t * .45) * 220}px)`;
  $('grid').style.transform = `translateY(${(t * 18) % 90}px)`;

  /* ---------- Marca no topo (cenas 2–4) ---------- */
  const ab = sceneAlpha(t, 3.1, 12.8, .4);
  show($('brandTag'), ab, `translateY(${lerp(-30, 0, easeOut(seg(t, 3.1, 3.6)))}px)`);

  /* ---------- Cena 1 (0 → 3.2) ---------- */
  const a1 = sceneAlpha(t, 0, 3.2, .25);
  show($('s1'), a1, null);
  if (a1 > 0) {
    const caret = (Math.floor(t * 3) % 2 === 0) ? '<span class="caret"></span>' : '';
    const l1 = COPY.t1;
    const l2 = COPY.t2;
    const p1 = seg(t, .15, .95), p2 = seg(t, 1.0, 1.4), p3 = seg(t, 1.45, 1.75);
    $('t1').innerHTML = type(l1, p1) + (p1 < 1 ? caret : '');
    $('t2').innerHTML = p2 > 0 ? type(l2, p2) + (p2 >= 1 ? '<span class="ok">9</span>' : '') : '';
    $('t3').innerHTML = p3 > 0 ? type(COPY.t3, p3) + caret : '';
    const ph = easeOut(seg(t, 1.5, 2.2));
    show($('h1'), ph, `translateY(${lerp(80, 0, ph)}px)`);
  }

  /* ---------- Cena 2 (3.0 → 7.2) — Vibrant Carousel ---------- */
  const a2 = sceneAlpha(t, 3.0, 7.2, .3);
  show($('s2'), a2, null);
  if (a2 > 0) {
    const n = cards.length;
    const k = easeInOut(seg(t, 3.3, 6.6)) * (n - 1);           // passa por todos os cartões
    const collapse = easeInOut(seg(t, 6.7, 7.2));
    cards.forEach((el, i) => {
      const enter = easeBack(seg(t, 3.0 + i * .06, 3.6 + i * .06));
      const d = i - k, ad = Math.min(Math.abs(d), 2.5);           // distância ao cartão da frente
      const x = d * 610 * (1 - collapse);
      const scale = (1.06 - ad * .16) * (1 - collapse * .6);
      const y = lerp(320, 0, enter) + ad * 18;
      el.style.transform = `translateX(${x}px) translateY(${y}px) rotateY(${clamp(-d * 22, -40, 40)}deg) scale(${scale})`;
      el.style.zIndex = Math.round(100 - ad * 30);
      el.style.opacity = clamp(enter * (1 - ad * .38) * (1 - collapse));
      el.style.filter = `blur(${ad * 2.5}px)`;
      el.style.setProperty('--flag', SUBS[i].u ? seg(t, 4.2, 4.6) : 0);
    });
    const count = easeOut(seg(t, 3.4, 6.5));
    $('totNum').textContent = eur(TOTAL * count);
    const pf = seg(t, 4.4, 5.0);
    $('s2foot').textContent = type(COPY.foot, pf);
    show($('totNum'), 1, `scale(${1 + collapse * .15})`);
  }

  /* ---------- Cena 3 (7.0 → 10.6) — Echo Wave + Monospace Callouts ---------- */
  const a3 = sceneAlpha(t, 7.0, 10.6, .3);
  show($('s3'), a3, null);
  if (a3 > 0) {
    const local = t - 7.0;
    rings.forEach((r, i) => {
      const cyc = ((local * .55 + i / rings.length) % 1);
      const size = lerp(260, 1300, cyc);
      r.style.width = r.style.height = size + 'px';
      r.style.marginLeft = r.style.marginTop = (-size / 2) + 'px';
      r.style.opacity = (1 - cyc) * .55 * seg(t, 7.0, 7.4);
      r.style.borderColor = i % 2 ? '#A78BFA' : '#7C3AED';
    });
    const pb = easeBack(seg(t, 7.0, 7.5));
    const pulse = 1 + Math.sin(local * 4.5) * .012;
    $('bigNum').textContent = eur(TOTAL);
    show($('bigNum'), seg(t, 7.0, 7.3), `scale(${lerp(.7, 1, pb) * pulse})`);
    show($('bigLabel'), seg(t, 7.3, 7.6));
    const calls = [
      ['c1', '[!]', '#FBBF24', COPY.c1, 7.6],
      ['c2', '[→]', '#A78BFA', COPY.c2, 8.3],
      ['c3', '[✓]', '#34D399', COPY.c3(eur(SAVE)), 9.0],
    ];
    calls.forEach(([id, tag, col, txt, st]) => {
      const p = easeOut(seg(t, st, st + .35));
      const tp = seg(t, st + .15, st + .75);
      $(id).innerHTML = `<span class="tag" style="color:${col}">${tag}</span>${type(txt, tp)}`;
      $(id).style.borderColor = col + '66';
      show($(id), p, `translateX(${lerp(-60, 0, p)}px)`);
    });
  }

  /* ---------- Cena 4 (10.4 → 12.9) — Poupança ---------- */
  const a4 = sceneAlpha(t, 10.4, 12.9, .3);
  show($('s4'), a4, null);
  if (a4 > 0) {
    const pa = easeBack(seg(t, 10.45, 10.95));
    show($('p0'), seg(t, 10.4, 10.7));
    show($('p1'), seg(t, 10.45, 10.7), `scale(${lerp(.6, 1, pa)})`);
    const pb = easeOut(seg(t, 10.9, 11.4));
    show($('p2'), pb, `translateY(${lerp(40, 0, pb)}px)`);
    $('p1').textContent = '−' + eur(SAVE);
    $('p3').textContent = type(COPY.p3(eur(SAVE * 12)), seg(t, 11.4, 12.0));
  }

  /* ---------- Cena 5 (12.7 → fim) — Logo ---------- */
  const a5 = seg(t, 12.7, 13.0);
  show($('s5'), a5, null);
  if (a5 > 0) {
    const pl = easeBack(seg(t, 12.75, 13.35));
    const float = Math.sin((t - 12.7) * 2.2) * 8;
    show($('logoWrap'), seg(t, 12.75, 12.95), `translateY(${float}px) scale(${lerp(.3, 1, pl)}) rotate(${lerp(-12, 0, pl)}deg)`);
    const pw = easeOut(seg(t, 13.15, 13.6));
    show($('word'), pw, `translateY(${lerp(50, 0, pw)}px)`);
    const pt = easeOut(seg(t, 13.45, 13.9));
    show($('tag'), pt, `translateY(${lerp(40, 0, pt)}px)`);
    const pp = easeBack(seg(t, 13.8, 14.25));
    show($('pill'), seg(t, 13.8, 14.0), `translateX(-50%) scale(${lerp(.6, 1, pp)})`);
  }
}
window.renderFrame = renderFrame;

/* ================= SOM =================
   Tudo sintetizado aqui (sem samples, sem direitos de terceiros) e determinístico.
   Estética de anúncios fintech/SaaS: house leve a 120 BPM, plucks limpos, pads quentes
   e sons de UI (cliques de teclado, whooshes, dings de notificação, chime de sucesso).
   buildAudio() serve tanto o preview (AudioContext) como o export (OfflineAudioContext). */
const BPM = 120, BEAT = 60 / BPM, BAR = BEAT * 4;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const CHORDS = [ // vi – IV – I – V (Am, F, C, G)
  { pad: [57, 60, 64], bass: 45 },
  { pad: [53, 57, 60], bass: 41 },
  { pad: [55, 60, 64], bass: 48 },
  { pad: [55, 59, 62], bass: 43 },
];
const C_ADD9 = [48, 55, 60, 62, 64, 67];

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// instante em que o carrossel muda de cartão (inverte o easeInOut)
function cardSwitchTimes() {
  const n = SUBS.length, out = [];
  for (let j = 1; j < n; j++) {
    const target = (j - .5) / (n - 1); let lo = 0, hi = 1;
    for (let k = 0; k < 30; k++) { const m = (lo + hi) / 2; if (easeInOut(m) < target) lo = m; else hi = m; }
    out.push(3.3 + lo * 3.3);
  }
  return out;
}
// instantes em que cada carácter aparece num texto "escrito"
function typeTimes(str, a, b) { const n = str.length, out = []; for (let i = 1; i <= n; i++) out.push(a + (b - a) * (i - .5) / n); return out; }

function buildAudio(ctx, offset = 0, base = 0) {
  const rnd = mulberry32(7);
  const sr = ctx.sampleRate;
  const at = t => base + (t - offset);
  const live = (t, dur = 0) => t + dur >= offset - 0.001;

  // bus: música + efeitos → reverb → compressor → saída
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = .004; comp.release.value = .2;
  const MG = 1.9; // ganho de saída (redes sociais ~ -14 LUFS)
  const master = ctx.createGain(); master.gain.value = MG;
  if (15.5 > offset) { master.gain.setValueAtTime(MG, Math.max(base, at(15.0))); master.gain.linearRampToValueAtTime(0, at(15.5)); }
  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -4; limiter.knee.value = 0; limiter.ratio.value = 20; limiter.attack.value = .001; limiter.release.value = .08;
  comp.connect(master).connect(limiter).connect(ctx.destination);
  const music = ctx.createGain(); music.gain.value = .55; music.connect(comp);
  const sfx = ctx.createGain(); sfx.gain.value = .9; sfx.connect(comp);
  const verb = ctx.createConvolver();
  { const len = Math.floor(sr * 2.2), ir = ctx.createBuffer(2, len, sr);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / len, 3); }
    verb.buffer = ir; }
  const verbOut = ctx.createGain(); verbOut.gain.value = .35; verb.connect(verbOut).connect(comp);

  const noiseBuf = ctx.createBuffer(1, sr * 2, sr);
  { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; }

  function env(g, t, peak, a, d) {
    g.gain.setValueAtTime(0, at(t));
    g.gain.linearRampToValueAtTime(peak, at(t + a));
    g.gain.exponentialRampToValueAtTime(.0001, at(t + a + d));
  }
  function out(node, dest, send = 0) { node.connect(dest); if (send) { const s = ctx.createGain(); s.gain.value = send; node.connect(s).connect(verb); } }

  function osc(t, freq, dur, { type = 'sine', gain = .2, a = .005, dest = sfx, send = 0, to = null, cutoff = 0 } = {}) {
    if (!live(t, dur)) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, at(t));
    if (to) o.frequency.exponentialRampToValueAtTime(to, at(t + dur));
    env(g, t, gain, a, dur);
    let n = o.connect(g);
    if (cutoff) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; n = g.connect(f); }
    out(n, dest, send);
    o.start(at(t)); o.stop(at(t + a + dur + .05));
  }
  function noise(t, dur, { type = 'bandpass', f0 = 1000, f1 = null, q = 1, gain = .2, a = .002, dest = sfx, send = 0, swell = false } = {}) {
    if (!live(t, dur)) return;
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, at(t)); if (f1) f.frequency.exponentialRampToValueAtTime(f1, at(t + dur));
    const g = ctx.createGain();
    if (swell) { g.gain.setValueAtTime(.0001, at(t)); g.gain.exponentialRampToValueAtTime(gain, at(t + dur * .85)); g.gain.linearRampToValueAtTime(0, at(t + dur)); }
    else env(g, t, gain, a, dur);
    out(src.connect(f).connect(g), dest, send);
    src.start(at(t), rnd() * 1.5); src.stop(at(t + dur + .05));
  }

  // instrumentos
  const kick = (t, g = .9) => { osc(t, 150, .32, { gain: g, to: 42, dest: music }); noise(t, .02, { type: 'highpass', f0: 3000, gain: .08 * g, dest: music }); };
  const hat = (t, g = .07) => noise(t, .045, { type: 'highpass', f0: 8000, gain: g, dest: music });
  const clap = t => { for (let i = 0; i < 3; i++) noise(t + i * .012, .09, { f0: 1600, q: .9, gain: .16, dest: music, send: .3 }); };
  const bass = (t, m, d = .22) => { osc(t, mtof(m), d, { type: 'triangle', gain: .32, dest: music, a: .01 }); osc(t, mtof(m) * 2, d * .7, { gain: .08, dest: music }); };
  const pluck = (t, m, g = .11, cutoff = 2600) => {
    osc(t, mtof(m), .28, { type: 'triangle', gain: g, dest: music, send: .45, cutoff });
    osc(t, mtof(m) * 1.003, .2, { type: 'sawtooth', gain: g * .25, dest: music, cutoff: cutoff * .6 });
  };
  const pad = (t, notes, dur, g = .045) => notes.forEach(m => {
    if (!live(t, dur)) return;
    [-6, 6].forEach(det => {
      const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), gn = ctx.createGain();
      o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det;
      f.type = 'lowpass'; f.frequency.value = 900;
      gn.gain.setValueAtTime(0, at(t)); gn.gain.linearRampToValueAtTime(g, at(t + .35));
      gn.gain.setValueAtTime(g, at(t + dur - .3)); gn.gain.linearRampToValueAtTime(0, at(t + dur));
      out(o.connect(f).connect(gn), music, .4); o.start(at(t)); o.stop(at(t + dur + .05));
    });
  });
  // sino FM — dings de notificação e chime de sucesso
  const bell = (t, m, g = .16, dur = 1.1) => {
    if (!live(t, dur)) return;
    const car = ctx.createOscillator(), mod = ctx.createOscillator(), mg = ctx.createGain(), g2 = ctx.createGain();
    const f = mtof(m); car.frequency.value = f; mod.frequency.value = f * 3.5;
    mg.gain.setValueAtTime(f * 2.2, at(t)); mg.gain.exponentialRampToValueAtTime(f * .05, at(t + dur));
    mod.connect(mg).connect(car.frequency); env(g2, t, g, .003, dur);
    out(car.connect(g2), sfx, .5);
    car.start(at(t)); mod.start(at(t)); car.stop(at(t + dur + .05)); mod.stop(at(t + dur + .05));
  };
  const click = (t, g = 1) => { noise(t, .014, { f0: 2400 + rnd() * 2200, q: 2, gain: .2 * g }); osc(t, 1900 + rnd() * 400, .012, { gain: .03 * g }); };
  const whoosh = (t, dur, f0, f1, g = .22) => noise(t, dur, { f0, f1, q: .9, gain: g, swell: true, send: .25 });
  const pop = (t, g = .25) => osc(t, 520, .07, { gain: g, to: 1250, send: .2 });
  const tickS = (t, m, g = .04) => osc(t, mtof(m), .035, { gain: g });
  const impact = (t, g = 1) => {
    osc(t, 110, .7, { gain: .95 * g, to: 32 });
    noise(t, .5, { type: 'lowpass', f0: 1800, f1: 200, gain: .35 * g, send: .6 });
  };
  const riser = (t0, t1) => { whoosh(t0, t1 - t0, 300, 7000, .26); osc(t0, 220, t1 - t0, { gain: .05, to: 880, a: (t1 - t0) * .9, type: 'triangle' }); };

  /* --- MÚSICA --- */
  // pads: progressão até 12.0, tensão em G até ao logo, resolve em C(add9)
  for (let b = 0; b < 6; b++) pad(b * BAR, CHORDS[b % 4].pad, BAR + .05, b < 1 ? .03 : .045);
  pad(12.0, CHORDS[3].pad, .8, .05);
  pad(12.75, C_ADD9, 2.75, .05);
  // arpejo pluck em colcheias (mais filtrado na intro)
  const ARP = [0, 1, 2, 12, 2, 1, 12, 2];
  for (let t = 0, i = 0; t < 12.0 - .01; t += BEAT / 2, i++) {
    const ch = CHORDS[Math.floor(t / BAR) % 4].pad;
    const st = ARP[i % 8], m = (st === 12 ? ch[0] + 12 : ch[st]) + 12;
    pluck(t, m, t < 3 ? .07 : .1, t < 3 ? 1200 + t * 400 : 2800);
  }
  // groove: entra no drop das 3.0 s
  for (let t = 3.0; t < 12.0 - .01; t += BEAT) {
    kick(t);
    hat(t + BEAT / 2, .08);
    if (t >= 7.0) { hat(t + BEAT / 4, .03); hat(t + BEAT * .75, .03); }
    const beatInBar = Math.round((t % BAR) / BEAT);
    if (t >= 4.0 && (beatInBar === 1 || beatInBar === 3)) clap(t);
    bass(t + BEAT / 2, CHORDS[Math.floor(t / BAR) % 4].bass);
  }
  // pré-drop na intro
  kick(2.0, .35); kick(2.5, .45);
  riser(2.1, 3.0);

  /* --- EFEITOS (sincronizados com a animação) --- */
  // cena 1 — terminal e pergunta
  typeTimes(COPY.t1, .15, .95).forEach(t => click(t));
  typeTimes(COPY.t2, 1.0, 1.4).forEach(t => click(t)); tickS(1.42, 84, .07);
  typeTimes(COPY.t3, 1.45, 1.75).forEach(t => click(t));
  whoosh(1.3, .3, 600, 3500, .16); pop(1.55, .18);
  // cena 2 — carrossel e contador
  impact(3.0, .55);
  cardSwitchTimes().forEach(t => whoosh(t - .12, .24, 900, 2600, .13));
  for (let t = 3.45, i = 0; t < 6.45; t += .1, i++) tickS(t, 76 + Math.floor(i / 3), .022);
  bell(4.2, 81, .1, .6); bell(4.32, 76, .08, .6);              // marcas "SEM USO"
  typeTimes(COPY.foot, 4.4, 5.0).forEach(t => click(t, .6));
  whoosh(6.55, .45, 4000, 400, .2);                              // cartões recolhem
  // cena 3 — total + alertas
  impact(7.0, .8);
  [[7.6, [76, 72]], [8.3, [79, 84]], [9.0, [72, 76, 79]]].forEach(([t, notes], k) => {
    notes.forEach((m, i) => bell(t + i * .08, m, .14));
    const txt = [COPY.c1, COPY.c2, COPY.c3(eur(SAVE))][k];
    typeTimes(txt, t + .15, t + .75).forEach(tt => click(tt, .5));
  });
  // cena 4 — poupança (chime de sucesso)
  whoosh(10.05, .4, 500, 5000, .2);
  impact(10.45, .7);
  [72, 76, 79, 84, 88].forEach((m, i) => bell(10.47 + i * .07, m, .13, 1.3));
  typeTimes(COPY.p3(eur(SAVE * 12)), 11.4, 12.0).forEach(t => click(t, .6));
  // cena 5 — logo
  riser(12.0, 12.75);
  impact(12.75, 1);
  C_ADD9.forEach(m => pluck(12.75, m + 12, .09, 3200));
  [84, 88, 91, 96].forEach((m, i) => bell(12.8 + i * .06, m, .07, 1.4));
  whoosh(13.05, .3, 800, 3000, .1);
  pop(13.85, .22); bell(13.9, 91, .09, 1.2);
}

// export: devolve o som completo em WAV (base64) para juntar ao vídeo
async function renderAudioWav() {
  const oc = new OfflineAudioContext(2, Math.ceil(48000 * DURATION), 48000);
  buildAudio(oc, 0, 0);
  const buf = await oc.startRendering();
  const n = buf.length, ch = [buf.getChannelData(0), buf.getChannelData(1)];
  const ab = new ArrayBuffer(44 + n * 4), v = new DataView(ab);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true); v.setUint32(24, 48000, true);
  v.setUint32(28, 48000 * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 4, true);
  for (let i = 0, o = 44; i < n; i++) for (let c = 0; c < 2; c++, o += 2) v.setInt16(o, Math.max(-1, Math.min(1, ch[c][i])) * 0x7FFF, true);
  let bin = ''; const bytes = new Uint8Array(ab);
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
window.renderAudioWav = renderAudioWav;

/* ---------- Escala do palco e playback ---------- */
const params = new URLSearchParams(location.search);
const isRender = params.has('render');
if (isRender) document.body.classList.add('render');

function fit() {
  if (isRender) { $('stage').style.left = $('stage').style.top = '0'; $('stage').style.transform = 'none'; return; }
  const vp = $('viewport').getBoundingClientRect();
  const s = Math.min(vp.width / 1080, vp.height / 1920);
  $('stage').style.transform = `scale(${s}) translate(-50%, -50%)`;
}
addEventListener('resize', fit); fit();

let playing = !isRender, t0 = performance.now(), cur = 0;
// com som ligado, o relógio da animação é o do AudioContext (sincronia exata)
let soundOn = false, actx = null, audioBase = 0, audioOffset = 0;
function stopAudio() { if (actx) { actx.close(); actx = null; } }
function startAudio(offset) {
  stopAudio();
  actx = new AudioContext({ sampleRate: 48000 });
  audioOffset = offset; audioBase = actx.currentTime + .08;
  buildAudio(actx, offset, audioBase);
}
function tick(now) {
  if (playing) {
    if (actx) {
      cur = audioOffset + Math.max(0, actx.currentTime - audioBase);
      if (cur >= DURATION) { cur = 0; startAudio(0); }
    } else cur = ((now - t0) / 1000) % DURATION;
    renderFrame(cur);
    $('scrub').value = Math.round(cur * 1000);
    $('time').textContent = cur.toFixed(2) + 's';
  }
  requestAnimationFrame(tick);
}
function setPlaying(p) {
  playing = p; $('play').textContent = p ? '⏸' : '▶';
  if (p && soundOn) startAudio(cur); else stopAudio();
  t0 = performance.now() - cur * 1000;
}
if (!isRender) {
  $('play').onclick = () => setPlaying(!playing);
  $('sound').onclick = () => { soundOn = !soundOn; $('sound').textContent = soundOn ? '🔊 som' : '🔇 som'; if (playing) setPlaying(true); };
  $('lang').onclick = () => { setLang(LANG === 'es' ? 'pt' : 'es'); renderFrame(cur); if (playing) setPlaying(true); };
  $('restart').onclick = () => { cur = 0; setPlaying(true); };
  $('scrub').oninput = e => { cur = e.target.value / 1000; setPlaying(false); renderFrame(cur); $('time').textContent = cur.toFixed(2) + 's'; };
  document.fonts.ready.then(() => requestAnimationFrame(tick));
} else {
  renderFrame(0);
}
</script>
